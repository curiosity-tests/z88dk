name: build-on-ubuntu

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "build-on-ubuntu ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout from git
      uses: crashappsec/action-checkout@main
      with: 
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        submodules: 'true'
    # ccache only defaults to $HOME/.ccache when that directory already exists,
    # which on a fresh runner it does not -- so ccache used $HOME/.cache/ccache
    # while we cached $HOME/.ccache, and nothing was ever cached. Pin it.
    # 400M because the repo only gets 10G of cache before GitHub evicts by age.
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=400M" >> $GITHUB_ENV
        # Compile the original source on a miss, not the preprocessed output.
        # ccache 3.x (what cygwin ships) defaults the other way, and the
        # preprocessor strips the "// fall through" comments that
        # -Wimplicit-fallthrough reads -- with -Werror that is a hard failure.
        # Default in 4.x; set everywhere so the behaviour does not depend on
        # which ccache a platform happens to package.
        echo "CCACHE_CPP2=1" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          ~/.ccache
        key: ${{ runner.os }}-ccache-native-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-native-
    - name: Update apt 
      run: |
        sudo apt update
    - name: Install apt dependencies
      run: |
        sudo apt install -y build-essential bison flex libxml2-dev subversion zlib1g-dev m4 ragel re2c dos2unix texinfo texi2html gdb curl cpanminus ccache libboost-dev libmodern-perl-perl libyaml-perl liblocal-lib-perl libcapture-tiny-perl libpath-tiny-perl libtext-table-perl libdata-hexdump-perl libregexp-common-perl libclone-perl libfile-slurp-perl libgmp-dev libspreadsheet-parsexlsx-perl
    - name: Identify perl runtime
      id: perl_runtime
      run: |
        echo "version=$(perl -MConfig -e 'print \"$Config{version}-$Config{archname}\"')" >> "$GITHUB_OUTPUT"
    # Rolled because actions/cache never overwrites an existing key: a fixed one
    # is written once and cannot even recover from the 7-day eviction.
    - name: Cache perl modules
      uses: actions/cache@v5
      with:
        path: |
          ~/perl5
        key: ${{ runner.os }}-${{ runner.arch }}-perl5-${{ steps.perl_runtime.outputs.version }}-${{ hashFiles('.github/workflows/build-on-ubuntu.yml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-perl5-${{ steps.perl_runtime.outputs.version }}-${{ hashFiles('.github/workflows/build-on-ubuntu.yml') }}-
          ${{ runner.os }}-${{ runner.arch }}-perl5-${{ steps.perl_runtime.outputs.version }}-
    - name: Install perl prerequisites
      run: |
        cpanm --local-lib=~/perl5 App::Prove Array::Compare Clone CPU::Z80::Assembler Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Regexp::Common Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table YAML::Tiny
    - name: Build binaries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        ./build.sh -v -l
    - name: Build libraries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b
    - name: Build examples
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        ./build.sh -v -b -l -e
    - name: Build sdcc needed for tests
      run: |
        make BUILD_SDCC=1 BUILD_SDCC_HTTP=1 bin/z88dk-zsdcc
    # sdcc itself is built with CC=$(OCC), the unwrapped compiler, so none of
    # its ~4800 files reach ccache -- this reports the z88dk tools only.
    - name: ccache stats
      if: always()
      run: ccache -s
    - name: Run tests
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b -l -t
